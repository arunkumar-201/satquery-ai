# SATQUERY AI - Docker Compose for full stack deployment
# Usage: docker-compose up --build

services:
  # PostgreSQL with PostGIS for geospatial support
  postgres:
    image: postgis/postgis:16-3.4
    container_name: satquery-postgres
    environment:
      POSTGRES_DB: satquery
      POSTGRES_USER: satquery
      POSTGRES_PASSWORD: satquery
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U satquery -d satquery"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - satquery-network

  # Backend API
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: satquery-backend
    environment:
      # Application
      APP_NAME: "SATQUERY AI"
      ENVIRONMENT: "production"
      SECRET_KEY: "${SECRET_KEY:-change-this-secret-key-in-production}"
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440

      # Server
      BACKEND_HOST: "0.0.0.0"
      BACKEND_PORT: 8000
      FRONTEND_URL: "http://localhost:5173"

      # Database - PostgreSQL in production
      DATABASE_URL: "postgresql+psycopg://satquery:satquery@postgres:5432/satquery"

      # AI Provider (configure via .env or environment)
      AI_PROVIDER: "${AI_PROVIDER:-demo}"
      AI_BASE_URL: "${AI_BASE_URL:-}"
      AI_API_KEY: "${AI_API_KEY:-}"
      AI_MODEL: "${AI_MODEL:-}"

      # Storage
      STORAGE_MODE: "local"
      STORAGE_PATH: "/app/storage"

      # CORS
      CORS_ORIGINS: "http://localhost:5173"
      MAX_UPLOAD_SIZE_MB: 50
    volumes:
      - backend_storage:/app/storage
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - satquery-network
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: satquery-frontend
    environment:
      VITE_API_URL: "http://localhost:8000"
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - satquery-network
    restart: unless-stopped

volumes:
  postgres_data:
  backend_storage:

networks:
  satquery-network:
    driver: bridge